name: MIKE
options:
  bundleIdPrefix: com.neonrost
  # Base language of the project: if macOS finds no matching translation,
  # it falls back to English.
  developmentLanguage: en
  # Translations live in MIKE/Localizable.xcstrings.
  knownRegions: [en, de, es, Base]
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  # TAR/GZip read+write for the Compression tool's TAR.GZ side. ZIP write is
  # still unimplemented upstream (read-only), which is why ZIPFoundation
  # covers ZIP instead — see ZIPFoundation below.
  # Pinned to 4.8.2, not the newer 4.9.0: that release raised SWCompression's
  # own minimum macOS deployment target from 13.0 to 14.0, which would force
  # MIKE's whole app target up with it. 4.8.2 is the last version still
  # compatible with MIKE's macOS 13.0 floor.
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    exactVersion: 4.8.2
  # SWCompression's own transitive dependency. Pinned for the same reason:
  # its newest version (2.1.0) also raised its minimum macOS target to 14.0,
  # which SPM would otherwise happily resolve to since SWCompression 4.8.2's
  # own dependency range allows it. 2.0.4 is the last version still at 10.13.
  BitByteData:
    url: https://github.com/tsolomko/BitByteData.git
    exactVersion: 2.0.4
  # ZIP read+write for the Compression tool's ZIP side, with built-in
  # Progress/cancel support.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
targets:
  MIKE:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MIKE
        excludes:
          - "Info.plist"
          - "Localizable.xcstrings"
          - "Resources"
      # The string catalog: English is the source, translations live alongside.
      - path: MIKE/Localizable.xcstrings
        buildPhase: resources
      # The two .js files belong in Copy Bundle Resources, never in
      # Compile Sources.
      - path: MIKE/Resources
        buildPhase: resources
      # Shipped inside the bundle so "Show License" can display them offline.
      - path: LICENSE
        buildPhase: resources
      # Apache 2.0, covering the bundled Readability.js.
      - path: LICENSE-Readability
        buildPhase: resources
    dependencies:
      - package: SWCompression
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonrost.MIKE
        PRODUCT_NAME: MIKE
        INFOPLIST_FILE: MIKE/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No sandbox: MIKE launches yt-dlp/ffmpeg from outside the bundle
        # and writes to folders the user picks.
        ENABLE_HARDENED_RUNTIME: YES
